# Conda environment for the Docking Bench pipeline.
#
#   conda env create -f env.yaml
#   conda activate dockbench
#
# Pinned to the versions this pipeline was developed and validated against.
# vina 1.2.x matters: the 1.1.2 binary still shipped by some channels has no
# Vinardo scoring and a different box/seed handling.
name: dockbench
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.13
  - rdkit>=2024.03
  - biopython>=1.83
  - openmm>=8.1
  - pdbfixer>=1.9
  - pip
  - pip:
      - vina>=1.2.5
      - meeko>=0.6.1
